name: Catalog377 diagnose IGC source variants and archive mirrors
on:
  push:
    paths:
      - '.github/workflows/catalog377-igc-hosts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - name: Test real IGC product listing and backup domains
        run: |
          python - <<'PY'
          import requests, socket
          from bs4 import BeautifulSoup
          hosts=['igc-aircon.com','www.igc-aircon.com','chel.igc-aircon.com','msk.igc-aircon.com','spb.igc-aircon.com','igc-aircon.ru','www.igc-aircon.ru','igc.com.ru','www.igc.com.ru']
          paths=['/product/kanalnye_bloki_vrf/','/product/kassetnye_vrf_4_kh_potochnye_komplekty/','/product/kassetnye_vrf_1_potochnye_komplekty/']
          for host in hosts:
            try: print('DNS',host, socket.getaddrinfo(host,None)[0][4][0],flush=True)
            except Exception as e: print('DNSERROR',host,str(e)[:80],flush=True)
            for scheme in ['https','http'] if host in ('igc-aircon.com','www.igc-aircon.com','chel.igc-aircon.com') else ['https']:
              url=f'{scheme}://{host}'+paths[0]
              try:
                r=requests.get(url,timeout=7,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ru-RU,ru;q=0.9'})
                text=BeautifulSoup(r.text,'html.parser').get_text(' ',strip=True)
                print('PAGE',r.status_code,len(r.content),r.url,'EXACT',text.count('IMS-BS22NHQ(DC)'), 'HEAD',text[:70],flush=True)
              except Exception as e:print('PAGEERR',url,str(e)[:125],flush=True)
          urls=['https://web.archive.org/web/20250000000000id_/https://igc-aircon.com/product/kanalnye_bloki_vrf/',
                'https://web.archive.org/cdx/search/cdx?url=igc-aircon.com/product/kanalnye_bloki_vrf/&output=json&filter=statuscode:200&limit=2',
                'https://r.jina.ai/https://igc-aircon.com/product/kanalnye_bloki_vrf/']
          for url in urls:
            try:
              r=requests.get(url,timeout=9)
              print('ARCHIVE',r.status_code,len(r.content),'MODEL',r.text.count('IMS-BS22NHQ(DC)'),r.url,repr(r.text[:100]),flush=True)
            except Exception as e: print('ARCHIVEERR',url,str(e)[:145],flush=True)
          PY