name: Climate 347 stage 25 final manifest audit
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage25.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - run: python climate-347/technical-docs/stage25_final_audit.py
      - name: Save audited final mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/technical-docs/final_mapping_stage25.json
          git commit -m 'Climate 347 stage 25 verified manifest mapping'
          git pull --rebase origin main
          git push origin HEAD:main
