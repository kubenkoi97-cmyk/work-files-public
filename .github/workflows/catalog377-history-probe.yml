name: Catalog377 historical IGC exact-model HTML discovery
# Common Crawl JSON parsing fixed; skip temporarily unavailable Internet Archive.
on:
  push:
    paths:
      - '.github/workflows/catalog377-history-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Probe archived exact model pages without bypassing rate limits
        run: python product-research/catalog-377/search_historical_igc.py
      - name: Save discovery evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/history-diagnostics/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record availability of historical IGC DC original product webpages'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 3
          done
          exit 1
