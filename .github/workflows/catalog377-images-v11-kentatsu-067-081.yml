name: Catalog377 v11 Kentatsu KTGV KTYV KTZV 15 images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog377-images-v11-kentatsu-067-081.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: python -m pip install -q --disable-pip-version-check Pillow
      - name: Fetch existing original HTML and image package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: |
          set -euo pipefail
          mkdir -p _sources/base _sources/recovery
          gh release download catalog377-batch-067-081 -p catalog377-067-081.zip -D _sources/base
          gh release download catalog377-recovery-batch-067-081 -p catalog377-067-081.zip -D _sources/recovery
          test -s _sources/base/catalog377-067-081.zip
          test -s _sources/recovery/catalog377-067-081.zip
          unzip -t _sources/base/catalog377-067-081.zip | tail -2
          unzip -t _sources/recovery/catalog377-067-081.zip | tail -2
      - name: Curate product gallery images from exact SKU base and recovery ZIPs
        env:
          SOURCE_ZIP: _sources/base/catalog377-067-081.zip
          SOURCE_ZIP_RECOVERY: _sources/recovery/catalog377-067-081.zip
          OUTPUT_DIR: out/catalog377-v11-ktgv-ktyv-ktzv
        run: python product-research/catalog-377/curate_images_v11_batch_067_081.py
      - name: Publish test package, source trace and QA contact sheet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: |
          set -euo pipefail
          tag="catalog377-images-v11-kentatsu-067-081-2026-11-14"
          zip="out/Kentatsu_KTGV_KTYV_KTZV_images_v11.zip"
          test -s "$zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip"               "out/catalog377-v11-ktgv-ktyv-ktzv/PHOTO_SOURCES.csv"               "out/catalog377-v11-ktgv-ktyv-ktzv/CONTACT_SHEET.png"               "out/catalog377-v11-ktgv-ktyv-ktzv/SUMMARY.json" --clobber
            gh release edit "$tag" --notes-file out/catalog377-v11-ktgv-ktyv-ktzv/README.txt
          else
            gh release create "$tag" "$zip" \
              "out/catalog377-v11-ktgv-ktyv-ktzv/PHOTO_SOURCES.csv" \
              "out/catalog377-v11-ktgv-ktyv-ktzv/CONTACT_SHEET.png" \
              "out/catalog377-v11-ktgv-ktyv-ktzv/SUMMARY.json" \
              --title "Catalog-744 unfilled: Kentatsu KTGV KTYV KTZV 15 SKUs (v11)" \
              --notes-file out/catalog377-v11-ktgv-ktyv-ktzv/README.txt \
              --target main
          fi
          gh release view "$tag" --json assets,url --jq '{url:.url,assets:[.assets[].name]}'
