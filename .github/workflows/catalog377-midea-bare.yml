name: Catalog377 capture exact Midea MIH90GHN18 original page
on:
  push:
    paths:
      - '.github/workflows/catalog377-midea-bare.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4 lxml
      - name: Save exact original Midea HTML and all product photos
        run: python product-research/catalog-377/capture_batch.py --start 340 --end 341 --only-master-unresolved
      - name: Publish immutable source files in ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create catalog377-midea-mih90-original             product-research/catalog-377/output/catalog377-341-341.zip             product-research/catalog-377/output/catalog377-341-341-status.csv             --title 'Midea MIH90GHN18 exact original seller HTML, specs and photos'             --notes 'Original external website HTML and local WebP photo gallery. Missing product-only narrative, if any, remains PARTIAL.'
      - name: Save product status
        run: |
          mkdir -p product-research/catalog-377/status
          cp product-research/catalog-377/output/catalog377-341-341-status.csv product-research/catalog-377/status/midea-mih90-original.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/status/midea-mih90-original.csv
          git commit -m 'Record exact Midea MIH90GHN18 original product page'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 4
          done
          exit 1
