name: Climate347 images stage 13 cabinet evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/climate347-images-stage13.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pymupdf requests beautifulsoup4 Pillow numpy
      - run: python climate-347/images/stage13_cabinets.py
      - name: Publish review evidence
        run: |
          set -euo pipefail
          tag="climate347-images-stage13-${GITHUB_RUN_ID}"
          gh release create "$tag" Climate347_stage13_cabinet_evidence.zip --title "Climate347 stage13 exact cabinet evidence (review)" --notes "Native product candidates and page evidence, not approved final images." --target "$GITHUB_SHA"
          gh release view "$tag" --json assets,url
          sha256sum Climate347_stage13_cabinet_evidence.zip
          curl -fsSL --range 0-3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/Climate347_stage13_cabinet_evidence.zip" | head -c4 | od -An -tx1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/images/audits/stage-13-*
          git commit -m 'Climate347 stage13 cabinet evidence'
          git pull --rebase origin main
          git push origin HEAD:main
