name: Climate 347 stage 20 verified blocked path files
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage20.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pymupdf
      - run: python climate-347/technical-docs/stage20_blocked_pack.py
      - name: Publish separate blocked technical documents
        run: |
          gh release create climate-347-pdf-stage20-${{ github.run_id }} /tmp/climate347v20/Climate_347_stage20_blocked_paths.zip /tmp/climate347v20/blocked_manifest.csv /tmp/climate347v20/summary.json /tmp/climate347v20/IMS7_manual_cover.jpg --title 'Climate 347 — stage 20 verified documents awaiting category paths' --notes 'Two models; no inferred Selectel paths. Stage17 upload package unchanged.'
