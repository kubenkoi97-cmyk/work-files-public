name: Catalog377 verify actual HTML and product images in all ZIPs
on:
  push:
    paths:
      - '.github/workflows/catalog377-audit-all.yml'
  workflow_run:
    workflows: ["Catalog377 recover exact-model cards missing in first pass"]
    types: [completed]
  # verify completion of all primary and recovery batches
  # final reconciliation of original plus corrected alternate vendor releases
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Download every released ZIP and verify actual resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python product-research/catalog-377/audit_archives.py
      - name: Commit audit report to public GitHub
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/audit/audit_status.csv                   product-research/catalog-377/audit/audit_summary.json                   product-research/catalog-377/audit/README.md
          git diff --staged --quiet && { echo "Audit unchanged"; exit 0; }
          git commit -m 'Publish checked real HTML and downloaded image quality for catalog 377'
          for n in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 5
          done
          exit 1
