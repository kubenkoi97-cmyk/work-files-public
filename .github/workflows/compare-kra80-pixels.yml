name: Compare KRA80 image pixel samples from user PNG and stored WebP
on:
  push:
    paths:
      - '.github/workflows/compare-kra80-pixels.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Install pillow
        run: python -m pip install --quiet pillow
      - name: Compare sampled pixels without uploading user PNGs
        shell: bash
        run: |
          curl -fsSL 'https://github.com/kubenkoi97-cmyk/work-files-public/releases/download/KRA80HFAN1-mircli-complete-2026-11-07/KRA80HFAN1_MirCli_complete.zip' -o /tmp/kra80.zip
          python - <<'PY'
          import base64,zlib,zipfile,io,math,json
          from PIL import Image
          samples=["","",""]
          lookup=[
            '5a6377207b9c_Kentatsu_KRA80HFAN1KPU95_RA.jpg',
            'fdb1a942dd5e_Kentatsu_KRA80HFAN1KPU95_RA.png',
            '1fb1196e7da3_Kentatsu_KRA80HFAN1KPU95_RA_1_.jpg'
          ]
          with zipfile.ZipFile('/tmp/kra80.zip') as z:
              for idx,(sample,name) in enumerate(zip(samples,lookup),1):
                  p=next(q for q in z.namelist() if q.endswith('/'+name))
                  im=Image.open(io.BytesIO(z.read(p))).convert('RGB')
                  expected=zlib.decompress(base64.b64decode(sample))
                  n=12; actual=bytes(c for j in range(n) for i in range(n) for c in im.getpixel((int((i+.5)*im.width/n),int((j+.5)*im.height/n))))
                  if len(expected)!=len(actual):raise RuntimeError('bad samples')
                  diff=[abs(a-b) for a,b in zip(expected,actual)]
                  mse=sum((a-b)**2 for a,b in zip(expected,actual))/len(diff)
                  psnr=(10*math.log10(255**2/mse)) if mse else 99
                  print('PHOTO',idx,json.dumps({'width':im.width,'height':im.height,'pixel_samples':144,'identical_rgb_samples':sum(expected[i:i+3]==actual[i:i+3] for i in range(0,len(diff),3)),'mean_absolute_channel_error':round(sum(diff)/len(diff),4),'max_channel_error':max(diff),'sampled_PSNR_dB':round(psnr,3)},ensure_ascii=False),flush=True)
          PY
