name: Catalog377 publish original manufacturer support archive for 52 unresolved HTMLs
on:
  push:
    paths:
      - '.github/workflows/catalog377-support-sources.yml'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - name: Download exact original factory PDF documents and verify model strings
        run: python product-research/catalog-377/save_unresolved_support.py
      - name: Publish archive in public GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="catalog377-unresolved-original-manufacturer-sources"
          zip="product-research/catalog-377/output/catalog377-unresolved-original-manufacturer-sources.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip"               --title "Catalog 377 — original manufacturer documentation for 52 unresolved HTML records"               --notes "Original PDF catalogues/manuals + a 52-SKU source map. Supplemental manufacturer documentation is NOT a substitute for original individual product HTML. Existing genuine PARTIAL HTML and local photos remain linked."
          fi
      - name: Publish source map and integrity evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/supporting-evidence/source_map.json                   product-research/catalog-377/supporting-evidence/sku_source_map.csv                   product-research/catalog-377/supporting-evidence/summary.json
          git commit -m 'Map official original manufacturer documents to 52 unsolved HTML models'
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 4
          done
          exit 1
