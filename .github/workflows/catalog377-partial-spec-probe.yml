name: Catalog377 inspect 40 partial original product page specification structures
on:
  push:
    paths:
      - '.github/workflows/catalog377-partial-spec-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python product-research/catalog-377/inspect_partial_spec_dom.py
