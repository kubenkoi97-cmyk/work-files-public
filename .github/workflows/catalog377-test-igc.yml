name: Catalog377 test official IGC exact photo source
on:
  push:
    paths:
      - '.github/workflows/catalog377-test-igc.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Capture exact IGC IMS-BS15NHQ(DC)
        run: python product-research/catalog-377/capture_batch.py --start 14 --end 15
      - name: Publish archive for this exact product
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create catalog377-igc-test-015             product-research/catalog-377/output/catalog377-015-015.zip             product-research/catalog-377/output/catalog377-015-015-status.csv             --title 'Catalog 377 - IGC IMS-BS15NHQ(DC) original HTML + photos test'             --notes 'Test of official IGC sources. HTML, resources and status in archive.'
