name: MIXED377 verify every model in archived series PDFs
on:
  push:
    paths:
      - '.github/workflows/mixed-377-independent-series-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pymupdf
      - name: Obtain published technical archive for independent audit
        run: |
          mkdir -p /tmp/mixed377/seriescheck
          gh release download mixed-377-technical-docs-2026-11-14-v6             -p 'MIXED_377_technical_docs_by_series_2026-11-14.zip'             -D /tmp/mixed377/seriescheck
      - name: Audit all 377 models and all 53 series without inferring full coverage
        run: |
          python product-research/catalog-377/techdocs-2026-11-14/independent_audit.py             /tmp/mixed377/seriescheck/MIXED_377_technical_docs_by_series_2026-11-14.zip             | tee /tmp/mixed377/seriescheck/audit_execution_log.txt
      - name: Publish QA report files and preserve current released archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/techdocs-2026-11-14/independent-audit-2026-11-14/
          git commit -m 'Independent QA: verify model-to-series PDF coverage, variant issues and duplicates'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 4
          done
          exit 1
