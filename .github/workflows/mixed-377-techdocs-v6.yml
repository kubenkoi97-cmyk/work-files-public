name: MIXED-377 last IGC DC5 document verification v6
on:
  push:
    paths:
      - '.github/workflows/mixed-377-techdocs-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  igc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - name: Download verified v5
        run: |
          mkdir -p /tmp/mixed377/v5 /tmp/mixed377/v6
          gh release download mixed-377-technical-docs-2026-11-14-v5              -p 'MIXED_377_technical_docs_by_series_2026-11-14.zip' -D /tmp/mixed377/v5
      - name: Fetch IGC precise DC5 original and/or declaration
        run: |
          python product-research/catalog-377/techdocs-2026-11-14/igc_4tm_v6.py              /tmp/mixed377/v5/MIXED_377_technical_docs_by_series_2026-11-14.zip              /tmp/mixed377/v6/MIXED_377_technical_docs_by_series_2026-11-14.zip              | tee /tmp/mixed377/v6/igc_4tm_evidence_log.txt
          unzip -t /tmp/mixed377/v6/MIXED_377_technical_docs_by_series_2026-11-14.zip | tail -3
      - name: Publish verified v6 one-ZIP archive
        run: |
          gh release create mixed-377-technical-docs-2026-11-14-v6              /tmp/mixed377/v6/MIXED_377_technical_docs_by_series_2026-11-14.zip              /tmp/mixed377/v6/igc_4tm_evidence_log.txt              --title 'MIXED 377 — final series PDF archive, IGC DC5 evidence pass v6'              --notes 'Exact 377 unfilled models only, 53 preliminary series. Strict proof-level distinctions: model-specific PDF/series-only PDF. Duplicate-clean verified v5 inputs kept intact. New IGC IMS-4TM proof included only if exact DC5 target appears. See igc_4tm_v6_status.json.'
