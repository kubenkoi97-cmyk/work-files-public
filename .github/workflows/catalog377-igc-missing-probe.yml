name: Catalog377 probe older IGC exact-product URLs
on:
  push:
    paths:
      - '.github/workflows/catalog377-igc-missing-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python product-research/catalog-377/probe_igc_missing_urls.py
