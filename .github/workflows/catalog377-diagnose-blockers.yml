name: Catalog377 52-model blocker root-cause report
on:
  push:
    paths:
      - '.github/workflows/catalog377-diagnose-blockers.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Classify true blockers and produce per-model fix plan
        run: python product-research/catalog-377/diagnose_blockers_52.py
      - name: Commit analysis and detail CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/diagnostics
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish exact 52 product HTML blocker root-cause diagnosis'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 4
          done
          exit 1
