name: MIXED-377 technical documentation by series
on:
  push:
    paths:
      - '.github/workflows/mixed-377-techdocs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install --quiet requests pymupdf
      - name: Download, check and catalogue exact-model technical PDFs
        run: python product-research/catalog-377/techdocs-2026-11-14/collect.py
      - name: Publish single public ZIP archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="mixed-377-technical-docs-2026-11-14-v2"
          artifact="product-research/catalog-377/techdocs-2026-11-14/MIXED_377_technical_docs_by_series_2026-11-14.zip"
          test -s "$artifact"
          unzip -t "$artifact" | tail -3
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" --clobber
          else
            gh release create "$tag" "$artifact" \
              --title "MIXED 377 — manufacturer documentation by series, round 2 (PDF text matching fixed)" \
              --notes "Exact scope: only the 377 unfilled SKU rows of Каталог 744. Manufacturer original catalogues and model-verified series excerpts, with original full PDFs preserved. Partial/unverified series explicitly remain open. See report.txt/audit.json in ZIP."
          fi
      - name: Publish report CSV back into public repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/techdocs-2026-11-14/series_documents_report.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage 3: corrected exact-SKU PDF match report for 53 series"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 4
          done
          exit 1
