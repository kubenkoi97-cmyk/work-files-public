name: Climate 347 PDF retrieval stage 5
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/download_stage5.py
      - name: Publish cumulative review archive
        run: |
          gh release create climate-347-pdf-stage5-${{ github.run_id }} /tmp/climate347v5/Climate_347_PDF_stage5_review.zip /tmp/climate347v5/summary.json /tmp/climate347v5/coverage_347.csv /tmp/climate347v5/model_evidence.csv /tmp/climate347v5/document_manifest.csv /tmp/climate347v5/download_attempts.csv --title 'Climate 347 — stage 5 cumulative original PDFs and review excerpts' --notes '347 SKU audit, deduplicated originals, candidate catalog excerpts, exact text evidence. Not final Selectel package. No Excel edits.'
