name: Diagnose effect-nn charset and Russian source content
on:
  push:
    paths:
      - '.github/workflows/catalog377-effect-charset.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python -m pip install -q requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          r=requests.get('https://www.effect-nn.ru/condition_65080.htm',timeout=25,headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS',r.status_code,'CTYPE',r.headers.get('content-type'),'ENC',r.encoding,'APPARENT',r.apparent_encoding)
          for encoding in (r.encoding, r.apparent_encoding,'cp1251','utf-8'):
              try:
                  soup=BeautifulSoup(r.content.decode(encoding,errors='replace'),'html.parser')
                  t=soup.get_text(' ',strip=True).lower()
                  print('ENCODING',encoding,'TITLE',soup.title.get_text(' ',strip=True)[:110] if soup.title else '-',
                      'DESC',('описание' in t),'SPECS',('характеристики' in t),
                      'POWER',('мощность' in t),'SAMPLE',repr(t[450:620]))
              except Exception as e: print('ERROR',encoding,str(e)[:80])
          PY
