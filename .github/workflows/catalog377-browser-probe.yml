name: Catalog377 inspect original product pages with real Chromium
# Store verified exact-SKU rendered HTML snapshots separate from server original.
on:
  push:
    paths:
      - '.github/workflows/catalog377-browser-probe.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspect browser DOM tabs, Product JSON-LD and source-visible text
        run: python product-research/catalog-377/inspect_browser_descriptions.py
      - name: Preserve original browser-rendered evidence separately from raw HTTP source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/browser-diagnostics/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record rendered Kentatsu/Midea product DOM and exact-description evidence'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 3
          done
          exit 1
