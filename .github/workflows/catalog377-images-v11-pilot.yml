name: Catalog377 v11 image curation pilot (unfilled only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog377-images-v11-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: python -m pip install -q --disable-pip-version-check Pillow
      - name: Fetch existing original HTML and image package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: |
          set -euo pipefail
          mkdir -p _sources
          gh release download catalog377-batch-062-066 -p catalog377-062-066.zip -D _sources
          test -s _sources/catalog377-062-066.zip
          unzip -t _sources/catalog377-062-066.zip | tail -2
      - name: Curate all product gallery images for exact 5 models
        env:
          SOURCE_ZIP: _sources/catalog377-062-066.zip
          OUTPUT_DIR: out/catalog377-v11-ktgv
        run: python product-research/catalog-377/curate_images_v11_pilot.py
      - name: Publish test package, source trace and QA contact sheet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: |
          set -euo pipefail
          tag="catalog377-images-v11-ktgv-pilot-2026-11-14"
          zip="out/Kentatsu_KTGV_images_v11_pilot.zip"
          test -s "$zip"
          gh release create "$tag" "$zip" \
            "out/catalog377-v11-ktgv/PHOTO_SOURCES.csv" \
            "out/catalog377-v11-ktgv/CONTACT_SHEET.png" \
            "out/catalog377-v11-ktgv/SUMMARY.json" \
            --title "Catalog-744 unfilled: Kentatsu KTGV image pilot (v11)" \
            --notes-file out/catalog377-v11-ktgv/README.txt \
            --target main
          gh release view "$tag" --json assets,url --jq '{url:.url,assets:[.assets[].name]}'
