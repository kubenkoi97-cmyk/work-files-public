name: Catalog377 search additional native retail catalogs for missing SKU
on:
  push:
    paths:
      - '.github/workflows/catalog377-retailer-search.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python product-research/catalog-377/search_vendor_catalogs.py
