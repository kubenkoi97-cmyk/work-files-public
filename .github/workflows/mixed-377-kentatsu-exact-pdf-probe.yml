name: MIXED377 find 2026 Kentatsu exact manuals (probe)
on:
  push:
    paths:
      - '.github/workflows/mixed-377-kentatsu-exact-pdf-probe.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe 2026 indexed document downloads without assuming applicability
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,re
          groups=[
          ("KTZV","kentatsu-ktzv-hzbn1-instruktsiya.pdf"),
          ("KTLV","kentatsu-ktlv-hzbn1-instruktsiya.pdf"),
          ("KTKV","kentatsu-ktkv-hzbn1-instruktsiya.pdf"),
          ("KTHV","kentatsu-kthv-hzbn1-instruktsiya.pdf"),
          ("KTGB","kentatsu-dx-pro-vii-ktgb-hzbn1-instruktsiya.pdf")]
          for group,slug in groups:
              results=[]
              for host in ["kzn.iclim.ru","krasnodar.iclim.ru","ryazan.iclim.ru","www.iclim.ru","iclim.ru"]:
                  url=f"https://{host}/library/{slug}"
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/pdf,*/*"})
                      with urllib.request.urlopen(req,timeout=9) as r:
                          header=r.read(8);code=r.status
                          results.append(f"{host}:{code}:{header!r}:{r.headers.get('Content-Type','')}")
                  except Exception as e:results.append(f"{host}:{type(e).__name__}:{str(e)[:65]}")
              print(group," | ".join(results),flush=True)
          PY
