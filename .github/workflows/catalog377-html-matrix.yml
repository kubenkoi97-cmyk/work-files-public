name: Catalog377 independently report 377 exact HTML page captures
on:
  push:
    paths:
      - '.github/workflows/catalog377-html-matrix.yml'
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python product-research/catalog-377/report_html_capture_matrix.py
      - name: Commit precise per-model original HTML evidence matrix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/status/html_capture_matrix.csv product-research/catalog-377/status/html_capture_summary.json product-research/catalog-377/status/html_capture_readme.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish separate exact original HTML capture and description completeness gates'
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 3
          done
          exit 1
