name: Catalog377 inspect saved Midea MIH90GHN18 DP original HTML specs
on:
  push:
    paths:
      - '.github/workflows/catalog377-midea-dp-debug.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4
      - name: Inspect saved seller source exact SKU DOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python product-research/catalog-377/inspect_coolsochi_archive.py
