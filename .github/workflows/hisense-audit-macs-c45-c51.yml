name: Audit MACS C45 C51 exact images

on:
  push:
    branches: [main]
    paths: [.github/workflows/hisense-audit-macs-c45-c51.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -q requests beautifulsoup4 pillow imagehash
      - name: Audit exact alternative dealer pages
        run: |
          python - <<'PY'
          import csv,io,re,hashlib
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image,ImageOps,ImageDraw
          import imagehash

          pages={
            'MACS-I-C45P2C/MACS-I-CSPС2':[
              'https://royal-clima.com.ru/macs-i-c45p2c',
              'https://komfort-split.ru/royal-clima-macs-i-c45p2s/',
              'https://mariupol.climate-group.ru/kassetnyy-vnutrenniy-blok-serii-macs-i-s-macs-i-c45p2s-macs-i-csps2/',
              'https://fancoil-kkb.ru/catalog/fankoily/kassetnye_fankoily/fankoily_royal_clima/kassetnyy-fankoyl-royal-clima-macs-i-c45p2c',
            ],
            'MACS-I-C51P2C/MACS-I-CSPС2':[
              'https://royal-clima.com.ru/macs-i-c51p2c',
              'https://toplan.ru/royal-clima-macs-i-c51p2c.html',
              'https://mariupol.climate-group.ru/kassetnyy-vnutrenniy-blok-serii-macs-i-s-macs-i-c51p2s-macs-i-csps2/',
              'https://royal-rus.ru/seriya-macs-i-c/vnutrenniy-blok-fankoyl-royal-clima-macs-i-c51p2c/',
              'https://klimat-ok.ru/catalog/kassetnye_fankoily/kassetnyi_fankoil_royal_clima_macs_i_c51p2c.html',
            ],
          }
          out=Path('Hisense/images-rebuild/2026-09-29/audits/packet08_c45_c51')
          out.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/150 Safari/537.36'})
          rows=[]
          bad=('logo','icon','sprite','banner','cert','sert','payment','delivery','flag','social','phone','visa','mastercard')
          for model,plist in pages.items():
              cand=[];seen=set();phs=[]
              for page in plist:
                  try:
                      rr=s.get(page,timeout=20)
                      if rr.status_code!=200:continue
                      soup=BeautifulSoup(rr.text,'html.parser')
                  except:continue
                  urls=set()
                  for tag in soup.find_all(['img','source','a']):
                      for a in ('src','data-src','data-original','data-lazy-src','href'):
                          v=tag.get(a)
                          if v and re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',v,re.I):urls.add(urljoin(page,v))
                      for a in ('srcset','data-srcset'):
                          v=tag.get(a)
                          if v:
                              for part in v.split(','):
                                  u=part.strip().split(' ')[0]
                                  if u and re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',u,re.I):urls.add(urljoin(page,u))
                  for u in sorted(urls):
                      if u in seen or any(x in u.lower() for x in bad):continue
                      seen.add(u)
                      try:
                          ir=s.get(u,timeout=15)
                          if ir.status_code!=200 or not ir.headers.get('content-type','').startswith('image/'):continue
                          b=ir.content
                          if len(b)<10000:continue
                          im=Image.open(io.BytesIO(b)).convert('RGB');w,h=im.size
                          if max(w,h)<350 or min(w,h)<250:continue
                          if max(w/h,h/w)>2.5:continue
                          ph=imagehash.phash(im)
                          if any(ph-x<=2 for x in phs):continue
                          phs.append(ph)
                          sha=hashlib.sha256(b).hexdigest()
                          cand.append((page,u,im,w,h,len(b),sha,str(ph)))
                      except:pass
              for i,x in enumerate(cand,1):
                  page,u,im,w,h,bs,sha,ph=x
                  rows.append([model,i,page,u,w,h,bs,sha,ph])
              tiles=[]
              for i,x in enumerate(cand,1):
                  page,u,im,w,h,bs,sha,ph=x
                  tile=Image.new('RGB',(320,350),'white')
                  obj=ImageOps.contain(im,(285,260),Image.Resampling.LANCZOS)
                  tile.paste(obj,((320-obj.width)//2,8))
                  d=ImageDraw.Draw(tile);d.text((8,276),f'{i:02d} {w}x{h} {bs//1024}KB',fill='black')
                  d.text((8,297),re.sub(r'^https?://([^/]+).*',r'\1',page)[:40],fill='black')
                  d.text((8,318),sha[:18],fill='black');tiles.append(tile)
              cols=3;rn=max(1,(len(tiles)+2)//3)
              sh=Image.new('RGB',(cols*320,rn*350),'white')
              for i,t in enumerate(tiles):sh.paste(t,((i%3)*320,(i//3)*350))
              safe='C45' if 'C45' in model else 'C51'
              sh.save(out/f'{safe}_CONTACT.jpg','JPEG',quality=90)
          with (out/'CANDIDATES.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f);w.writerow(['model','candidate_no','page','image_url','width','height','bytes','sha256','phash']);w.writerows(rows)
          print('rows',len(rows))
          PY

      - name: Save audit
        run: |
          set -euxo pipefail
          DIR="Hisense/images-rebuild/2026-09-29/audits/packet08_c45_c51"
          TMP="/tmp/p08_c45c51"
          cp -a "$DIR" "$TMP"
          git reset --hard
          git clean -fdx
          git checkout --orphan audit-c45c51
          git rm -rf . || true
          git clean -fdx
          mkdir -p "Hisense/images-rebuild/2026-09-29/audits"
          cp -a "$TMP" "$DIR"
          git add "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit exact MACS C45 and C51 images"
          git push -f origin audit-c45c51:refs/heads/hisense-audit-packet08-c45-c51
