name: Climate347 images stage 11 alternate exact sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/climate347-images-stage11.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4 Pillow
      - run: python climate-347/images/stage11_alternates.py
      - name: Save review data and release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/images/audits/stage-11-*
          git commit -m 'Climate347 stage11 acquisition evidence'
          git pull --rebase origin main
          git push origin HEAD:main
          tag="climate347-images-stage11-${GITHUB_RUN_ID}"
          gh release create "$tag" Climate347_stage11_alternatives.zip --title "Climate347 stage11 alternatives (not approved)" --notes "Candidate images; see exact source and pixel hashes, no v11 approval." --target "$GITHUB_SHA"
          gh release view "$tag" --json url,assets --jq '{url,assets:[.assets[]|{name,size,url}]}'
          sha256sum Climate347_stage11_alternatives.zip
          curl -fsSL --range 0-3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/Climate347_stage11_alternatives.zip" | head -c4 | od -An -tx1 || true
