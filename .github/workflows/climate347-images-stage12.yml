name: Climate347 images stage 12 native PDF image extraction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/climate347-images-stage12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pymupdf Pillow numpy requests
      - run: python climate-347/images/stage12_pdf_native.py
      - name: Publish review candidates and save manifest
        run: |
          set -euo pipefail
          tag="climate347-images-stage12-${GITHUB_RUN_ID}"
          gh release create "$tag" Climate347_stage12_PDF_native_candidates.zip --title "Climate347 stage12 native PDF raster candidates (not approved)" --notes "Native extracted raster candidates, original page contexts, exact/base code leads. No approval; exclude diagrams and unrelated visuals." --target "$GITHUB_SHA"
          gh release view "$tag" --json url,assets --jq '{url,assets:[.assets[]|{name,size,url}]}'
          sha256sum Climate347_stage12_PDF_native_candidates.zip
          curl -fsSL --range 0-3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/Climate347_stage12_PDF_native_candidates.zip" | head -c4 | od -An -tx1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/images/audits/stage-12-pdf-* climate-347/images/audits/stage-12-contact-*
          git commit -m 'Climate347 stage12 native PDF evidence'
          git pull --rebase origin main
          git push origin HEAD:main
