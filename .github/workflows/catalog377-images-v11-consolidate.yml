name: Catalog744 v11 consolidate 377 unfilled product photo packets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog377-images-v11-consolidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all completed stages and consolidate one series-based archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: python product-research/catalog-377/consolidate_images_v11.py
      - name: Publish public consolidated Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: |
          set -euo pipefail
          target="product-research/catalog-377/images-v11-final"
          archive="$target/Catalog_744_images_v11_all.zip"
          test -s "$archive"
          tag="catalog377-images-v11-all-377-2026-11-14"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$target/SUMMARY_ALL.json" \
              "$target/ALL_377_MODELS.csv" "$target/COMPLETION.txt" --clobber
            gh release edit "$tag" --notes "Общий ZIP с 377 моделями (только без заливки), точными кодами и первоисточниками. Для 22 точных моделей нет доступных исходных HTML. 355 комплектов изображений предварительно обработаны; визуальная QA обязательна."
            gh release delete-asset "$tag" "_744_._v11_.zip" -y || true
          else
            gh release create "$tag" \
              "$archive" "$target/SUMMARY_ALL.json" "$target/ALL_377_MODELS.csv" "$target/COMPLETION.txt" \
              --title "Каталог 744 — изображения 377 незалитых моделей (v11)" \
              --notes "355 точных наборов изображений по сериям и моделям. 22 модели не имеют подтверждённого HTML. Визуальная проверка изображений ещё требуется." \
              --target main
          fi
          # Public unauthenticated GET: no GitHub API token header is sent.
          curl --fail --silent --show-error --location --max-time 35 \
            "https://api.github.com/repos/kubenkoi97-cmyk/work-files-public/releases/tags/$tag" \
            --output /tmp/release-public.json
          python -c 'import json; j=json.load(open("/tmp/release-public.json")); print("PUBLIC_RELEASE",j["html_url"],"assets",len(j["assets"]))'
          sha256sum "$archive"
          gh release view "catalog377-images-v11-all-377-2026-11-14" --json assets,url --jq '{url:.url,assets:[.assets[].name]}'
