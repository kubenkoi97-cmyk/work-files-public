name: Catalog377 independently audit recovered 40 PARTIAL source ZIPs
on:
  push:
    paths:
      - '.github/workflows/catalog377-partial-audit-v3.yml'
      - 'product-research/catalog-377/audit_partial_effect_v3.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify_and_reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 lxml pillow
      - name: Download 5 release ZIPs again, independently audit full exact SKU, prose and photos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python product-research/catalog-377/audit_partial_effect_v3.py
      - name: Commit proof and reconciled master 377 status
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/audit-v3/ \
                  product-research/catalog-377/status/master_status.csv \
                  product-research/catalog-377/status/master_summary.json \
                  product-research/catalog-377/status/summary.md \
                  product-research/catalog-377/status/html_capture_matrix.csv \
                  product-research/catalog-377/status/html_capture_summary.json
          if git diff --cached --quiet; then echo 'Nothing to update'; exit 0; fi
          git commit -m 'Independently verify recovered exact original HTML and reconcile 377 catalog'
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog377-partial-audit-v3
          path: product-research/catalog-377/audit-v3/
          retention-days: 7
