name: Catalog377 fast sequential recover each missing original HTML model
on:
  push:
    paths:
      - '.github/workflows/catalog377-fast-sequential.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog377-fast-sequential
  cancel-in-progress: false
jobs:
  all-missing-skus:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML + photo verification dependencies
        run: python -m pip install -q requests beautifulsoup4 lxml pillow
      - name: One SKU -> source -> photos -> ZIP QA -> GitHub Release -> immediate status commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python product-research/catalog-377/fast_sequential.py --max-models 62
      - name: Preserve fallback checkpoint files if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog377-fast-sequential-checkpoints
          path: product-research/catalog-377/status/fast-sequential/
          retention-days: 14
