name: Catalog377 diagnose exact IGC HTTP product detail parsing
on:
  push:
    paths:
      - '.github/workflows/catalog377-igc-detail-debug.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4 lxml
      - name: Diagnose product page direct URLs and headings
        run: python product-research/catalog-377/diagnose_igc_detail.py
