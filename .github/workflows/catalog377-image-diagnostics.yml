name: Diagnose exact KTZV60 image extraction
on:
  push:
    paths:
      - '.github/workflows/catalog377-image-diagnostics.yml'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public HTML image tags
        run: |
          python -m pip install -q requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://climatehnik.com/catalog/promyshlennye-konditsionery/vrf-sistemy/mini-vrf/vnutrennie-bloki/kentatsu-deiks-pro-beysik-dx-pro-basic-ktzv-ktzv60hzbn1/'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=25)
          print('STATUS',r.status_code,'BYTES',len(r.content))
          soup=BeautifulSoup(r.text,'html.parser')
          for i,im in enumerate(soup.find_all('img')[:60]):
             print('IMAGE',i,'ALT',repr(im.get('alt','')[:130]),'SRC',repr(im.get('src','')[:170]),
                   'DATASRC',repr(im.get('data-src','')[:120]),
                   'PARENT',im.parent.get('class') if im.parent else None)
          for meta in soup.find_all('meta'):
             if 'image' in str(meta.get('property','')).lower() or 'image' in str(meta.get('name','')).lower():
                print('METAIMG',str(meta)[:500])
          PY
