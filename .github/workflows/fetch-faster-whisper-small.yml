name: Fetch Faster Whisper small
on:
  push:
    paths:
      - '.github/workflows/fetch-faster-whisper-small.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p model
          python -m pip install huggingface_hub
          python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="Systran/faster-whisper-small", local_dir="model")'
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-small-model
          path: model/
          compression-level: 0
          retention-days: 1
