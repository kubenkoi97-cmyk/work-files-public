name: Climate 347 stage 13 universal technical-only package
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/stage13_audit.py
      - name: Publish technical-only package and audit
        run: |
          gh release create climate-347-pdf-stage13-${{ github.run_id }} /tmp/climate347v13/Climate_347_stage13_partial_Selectel.zip /tmp/climate347v13/Climate_347_stage13_delta_review.zip /tmp/climate347v13/summary.json /tmp/climate347v13/coverage_347.csv /tmp/climate347v13/remaining.csv /tmp/climate347v13/html_by_model.csv /tmp/climate347v13/partial_selectel_manifest.csv /tmp/climate347v13/download_attempts.csv /tmp/climate347v13/excluded_documents_audit.csv --title 'Climate 347 — stage 13 universal technical-only package' --notes 'Certificates and declarations excluded from final package and coverage. Candidates separate. Selectel not uploaded.'
      - name: Publish source previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/technical-docs/stage13-previews
          if ! git diff --cached --quiet; then git commit -m 'Stage 13 source page evidence'; git pull --rebase; git push; fi
