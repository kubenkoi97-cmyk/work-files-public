name: Catalog377 probe HTTP accessible original Midea HTML
on:
  push:
    paths:
      - '.github/workflows/catalog377-http-probe-midea.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python product-research/catalog-377/probe_http_sites.py
