name: Climate 347 stage 9 verified catalogue extracts and manuals
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage9.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/stage9_visual_pack.py
      - name: Publish verified scope and updated review archives
        run: |
          gh release create climate-347-pdf-stage9-${{ github.run_id }} /tmp/climate347v9/Climate_347_stage9_partial_Selectel.zip /tmp/climate347v9/Climate_347_stage9_review.zip /tmp/climate347v9/summary.json /tmp/climate347v9/coverage_347.csv /tmp/climate347v9/partial_selectel_manifest.csv /tmp/climate347v9/html_by_model.csv /tmp/climate347v9/new_verified_assignments.csv /tmp/climate347v9/stage9_checks.csv /tmp/climate347v9/stage9_new_downloads.csv --title 'Climate 347 — stage 9 visually verified documents' --notes 'Exact scope verified for included documents. Not a complete project. Selectel publication has not taken place.'
