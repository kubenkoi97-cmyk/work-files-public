name: Climate 347 PDF retrieval stage 4
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/download_stage4.py
      - name: Publish validated partial original PDF archive
        run: |
          gh release create climate-347-pdf-stage4-${{ github.run_id }} /tmp/climate347/Climate_347_PDF_stage4_partial.zip /tmp/climate347/summary.json /tmp/climate347/model_evidence.csv /tmp/climate347/document_manifest.csv --title 'Climate 347 — stage 4 original PDFs (partial, review required)' --notes 'Original PDF bytes, hashes and exact text evidence. Partial archive; no Selectel upload, no final Excel coverage. Catalog excerpts and visual/regional review pending.'
