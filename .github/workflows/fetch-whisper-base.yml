name: Fetch Whisper base
on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-base.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download package files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/wheels bundle/model
          python -m pip download --no-deps -d bundle/wheels openai-whisper
          python -m pip download --only-binary=:all: -d bundle/wheels tiktoken
          python -m pip install openai-whisper
          MODEL_URL=$(python -c 'import whisper; print(whisper._MODELS["base"])')
          echo "$MODEL_URL"
          curl -L --fail --retry 5 --retry-delay 2 -o bundle/model/base.pt "$MODEL_URL"
          sha256sum bundle/model/base.pt | tee bundle/model/SHA256SUMS.txt
      - name: Upload Whisper bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-bundle
          path: bundle/
          compression-level: 0
          retention-days: 1
