name: MIXED377 v6 verify 25 remaining direct manuals
on:
  push:
    paths:
      - '.github/workflows/mixed-377-v6-last-25-docs-probe.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - name: Inspect exact models in IGC 5 6 7 + Kentatsu 2026 PDFs
        run: python product-research/catalog-377/techdocs-2026-11-15/probe_remaining_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-377-v6-pdf-probe
          path: /tmp/mixed_v6_probe.json
          retention-days: 10
