name: Audit HiMod AE2 exact product images

on:
  push:
    branches: [main]
    paths: [.github/workflows/hisense-audit-himod.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -q requests beautifulsoup4 pillow
      - name: Scrape exact model pages and build contact sheets
        run: |
          python - <<'PY'
          import csv,io,hashlib,html,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image,ImageOps,ImageDraw,ImageFont

          pages={
            'HFRWE-65DGF-SYS':[
              'https://iclim.ru/catalog/promyshlennye_konditsionery/chillery/hisense_hfrwe_65dgf_sys/',
              'https://hi.1clim.ru/catalog/chillery/hisense_hfrwe_65dgf_sys/',
              'https://breez.ru/products/hi-mod-ae2/',
              'https://toplan.ru/hisense-hfrwe-65dgf-sys.html',
            ],
            'HFRWE-130DGF-SYS':[
              'https://iclim.ru/catalog/promyshlennye_konditsionery/chillery/hisense_hfrwe_130dgf_sys/',
              'https://hi.1clim.ru/catalog/chillery/hisense_hfrwe_130dgf_sys/',
              'https://breez.ru/products/hi-mod-ae2/',
            ],
          }
          out=Path('Hisense/images-rebuild/2026-09-29/audits/packet15_himod')
          out.mkdir(parents=True,exist_ok=True)
          ses=requests.Session()
          ses.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'})
          rows=[]
          selected={}
          for model,plist in pages.items():
            cand=[]
            seen_urls=set(); seen_hash=set()
            for page in plist:
              try:
                r=ses.get(page,timeout=25); r.raise_for_status()
              except Exception as e:
                rows.append([model,page,'PAGE_ERROR:'+repr(e),0,0,0,'',''])
                continue
              soup=BeautifulSoup(r.text,'html.parser')
              urls=set()
              for tag in soup.find_all(['img','source','a']):
                for a in ('src','data-src','data-original','data-lazy-src','href'):
                  v=tag.get(a)
                  if v and re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',v,re.I):
                    urls.add(urljoin(page,v))
                for a in ('srcset','data-srcset'):
                  v=tag.get(a)
                  if v:
                    for part in v.split(','):
                      u=part.strip().split(' ')[0]
                      if u and re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',u,re.I):
                        urls.add(urljoin(page,u))
              for u in sorted(urls):
                if u in seen_urls: continue
                seen_urls.add(u)
                try:
                  ir=ses.get(u,timeout=20)
                  if ir.status_code!=200 or not ir.headers.get('content-type','').startswith('image/'): continue
                  b=ir.content
                  if len(b)<12000: continue
                  im=Image.open(io.BytesIO(b)).convert('RGB')
                  w,h=im.size
                  if max(w,h)<400: continue
                  sha=hashlib.sha256(b).hexdigest()
                  if sha in seen_hash: continue
                  seen_hash.add(sha)
                  rows.append([model,page,u,w,h,len(b),sha,ir.headers.get('content-type','')])
                  cand.append((page,u,im,w,h,len(b),sha))
                except Exception:
                  pass
            selected[model]=cand
            # contact sheet
            tiles=[]
            for idx,(page,u,im,w,h,bs,sha) in enumerate(cand,1):
              tile=Image.new('RGB',(320,360),'white')
              obj=ImageOps.contain(im,(280,280),Image.Resampling.LANCZOS)
              tile.paste(obj,((320-obj.width)//2,10))
              d=ImageDraw.Draw(tile)
              d.text((8,300),f'{idx:02d}  {w}x{h}  {bs//1024}KB',fill='black')
              host=re.sub(r'^https?://([^/]+).*',r'\1',page)
              d.text((8,322),host[:42],fill='black')
              d.text((8,340),sha[:18],fill='black')
              tiles.append(tile)
            cols=3; rowsn=max(1,(len(tiles)+cols-1)//cols)
            sheet=Image.new('RGB',(cols*320,rowsn*360),'white')
            for i,t in enumerate(tiles): sheet.paste(t,((i%cols)*320,(i//cols)*360))
            sheet.save(out/f'{model}_CONTACT_SHEET.jpg','JPEG',quality=90)
          with (out/'CANDIDATES.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f); w.writerow(['model','page','image_url','width','height','bytes','sha256','content_type']); w.writerows(rows)
          (out/'README.txt').write_text(
            'Exact-model image audit for HiMod AE2. Contact sheets are for visual filtering before final ingestion.\n',
            encoding='utf-8')
          print('candidate rows',len(rows))
          PY

      - name: Save audit to clean branch
        run: |
          set -euxo pipefail
          DIR="Hisense/images-rebuild/2026-09-29/audits/packet15_himod"
          TMP="/tmp/packet15_himod_audit"
          cp -a "$DIR" "$TMP"
          git reset --hard
          git clean -fdx
          git checkout --orphan audit-p15
          git rm -rf . || true
          git clean -fdx
          mkdir -p "Hisense/images-rebuild/2026-09-29/audits"
          cp -a "$TMP" "$DIR"
          git add "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit exact HiMod AE2 image candidates"
          git push -f origin audit-p15:refs/heads/hisense-audit-packet15
