name: Catalog377 IGC HTTP manufacturer exact-product pilot
on:
  push:
    paths:
      - '.github/workflows/catalog377-igc-http-pilot.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -q requests beautifulsoup4 lxml pillow
      - name: Capture original exact model manufacturer HTML plus images
        run: python product-research/catalog-377/capture_batch.py --start 15 --end 16 --only-master-unresolved
      - name: Publish ZIP with actual photo files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create catalog377-igc-http-pilot-016             product-research/catalog-377/output/catalog377-016-016.zip             product-research/catalog-377/output/catalog377-016-016-status.csv             --title 'IGC IMS-BS22NHQ(DC) original HTTP product HTML and images'             --notes 'Manufacturer original HTML exact full model SKU. Photographs and resources stored locally when available. Inspect CSV for outcome.'
      - name: Save verified status to registry
        run: |
          mkdir -p product-research/catalog-377/status
          cp product-research/catalog-377/output/catalog377-016-016-status.csv product-research/catalog-377/status/igc-http-pilot-016.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/status/igc-http-pilot-016.csv
          git commit -m 'Log true manufacturer HTML for IGC IMS-BS22NHQ DC' || true
          git pull --rebase origin main && git push