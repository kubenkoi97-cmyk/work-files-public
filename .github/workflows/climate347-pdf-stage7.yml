name: Climate 347 stage 7 visual scope and downloads
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/download_stage7.py
      - name: Publish partial and cumulative archives
        run: |
          gh release create climate-347-pdf-stage7-${{ github.run_id }} /tmp/climate347v7/Climate_347_PDF_stage7_review.zip /tmp/climate347v7/Climate_347_stage7_partial_Selectel.zip /tmp/climate347v7/summary.json /tmp/climate347v7/coverage_347.csv /tmp/climate347v7/visual_scope_evidence.csv /tmp/climate347v7/partial_selectel_manifest.csv /tmp/climate347v7/stage7_download_attempts.csv --title 'Climate 347 — stage 7 visual scope and partial Selectel preparation' --notes 'Partial verified scope package and cumulative review archive. Links are planned, not published to Selectel.'
      - name: Publish chiller table previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/technical-docs/stage7-scan-previews
          if ! git diff --cached --quiet; then git commit -m 'Save IGC chiller model table previews'; git push; fi
