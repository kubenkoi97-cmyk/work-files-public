name: Climate 347 PDF retrieval stage 6
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/download_stage6.py
      - name: Publish cumulative review archive
        run: |
          gh release create climate-347-pdf-stage6-${{ github.run_id }} /tmp/climate347v6/Climate_347_PDF_stage6_review.zip /tmp/climate347v6/summary.json /tmp/climate347v6/coverage_347.csv /tmp/climate347v6/model_evidence.csv /tmp/climate347v6/winter_base_evidence.csv /tmp/climate347v6/winter_option_pages.csv /tmp/climate347v6/document_manifest.csv /tmp/climate347v6/download_attempts.csv /tmp/climate347v6/scan_diagnostics.csv --title 'Climate 347 — stage 6 winter-scope and scan review' --notes 'Inventory hash checked against source workbook list; full original archive and separate winter base-model evidence. Review required. No Selectel upload.'
      - name: Publish scan preview evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/technical-docs/stage6-scan-previews
          if ! git diff --cached --quiet; then git commit -m 'Save IGC original PDF review page previews'; git push; fi
