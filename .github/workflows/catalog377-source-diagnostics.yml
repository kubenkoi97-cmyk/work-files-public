name: Diagnose external exact model HTML lookup
on:
  push:
    paths:
      - '.github/workflows/catalog377-source-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact product and search source URLs
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote
          urls=[
          'https://msk.climate-group.ru/vnutrenniy-blok-vrf-sistemy-kentatsu-ktzv60hzbn1/',
          'https://brand-climat.ru/kentatsu-ktzv60hzbn1',
          'https://climatehnik.com/search/?q=KTZV60HZBN1',
          'https://envok.ru/search/?q=KTZV60HZBN1',
          'https://www.bing.com/search?format=rss&q=%22KTZV60HZBN1%22',
          'https://www.google.com/search?q=%22KTZV60HZBN1%22',
          'https://msk.climate-group.ru/search/?q=KTZV60HZBN1',
          'https://coolsochi.ru/product/kentatsu-ktzv60hzbn1/',
          'https://nizhniy-novgorod.vsekondicioneri.ru/product/kentatsu-ktzv60hzbn1/',
          'https://mircli.ru/search/?keyword=KTZV60HZBN1'
          ]
          for u in urls:
             try:
                r=requests.get(u,timeout=12,headers={'User-Agent':'Mozilla/5.0'})
                s=BeautifulSoup(r.text,'html.parser')
                title=s.title.get_text(" ",strip=True) if s.title else ''
                h=[h.get_text(" ",strip=True) for h in s.find_all("h1")]
                links=[a.get('href','') for a in s.find_all('a',href=True) if 'KTZV60HZBN1' in a.get('href','').upper()]
                print('STATUS',r.status_code,'LEN',len(r.content),'MODEL',r.text.upper().count('KTZV60HZBN1'),
                      'TITLE',repr(title[:100]),'H1',repr(h[:1]),
                      'LINKS',repr(links[:2]),'URL',u,flush=True)
             except Exception as e:
                print('ERROR',str(e)[:150],'URL',u,flush=True)
          PY
