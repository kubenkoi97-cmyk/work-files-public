name: Catalog377 fast sequential one-SKU pilot
# Confirm the SKU checkpoint really appears in the public repo after commit fix.
on:
  push:
    paths:
      - '.github/workflows/catalog377-fast-pilot.yml'
permissions:
  contents: write
concurrency:
  group: catalog377-fast-pilot
  cancel-in-progress: false
jobs:
  one-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML and image QA dependencies
        run: python -m pip install -q requests beautifulsoup4 lxml pillow
      - name: Process Kentatsu KTKB18HZBN1 and commit checkpoint immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python product-research/catalog-377/fast_sequential.py --start-row 170 --end-row 170 --max-models 1
