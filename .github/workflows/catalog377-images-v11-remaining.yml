name: Catalog744 v11 images remaining unfilled 342 models
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog377-images-v11-remaining.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batches:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { start: 2, end: 16 }
          - { start: 17, end: 31 }
          - { start: 32, end: 46 }
          - { start: 47, end: 61 }
          - { start: 62, end: 62 }
          - { start: 98, end: 112 }
          - { start: 113, end: 127 }
          - { start: 128, end: 142 }
          - { start: 143, end: 157 }
          - { start: 158, end: 172 }
          - { start: 173, end: 187 }
          - { start: 188, end: 202 }
          - { start: 203, end: 217 }
          - { start: 218, end: 232 }
          - { start: 233, end: 247 }
          - { start: 248, end: 262 }
          - { start: 263, end: 275 }
          - { start: 276, end: 290 }
          - { start: 291, end: 305 }
          - { start: 306, end: 320 }
          - { start: 321, end: 335 }
          - { start: 336, end: 350 }
          - { start: 351, end: 365 }
          - { start: 366, end: 378 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q Pillow
      - name: Build full product gallery from exact archived product HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
          START_ROW: ${{ matrix.start }}
          END_ROW: ${{ matrix.end }}
          OUTPUT_DIR: out/v11-${{ matrix.start }}-${{ matrix.end }}
        run: python product-research/catalog-377/curate_images_v11_all_batches.py
      - name: Upload each independently verified ZIP as public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
          START_ROW: ${{ matrix.start }}
          END_ROW: ${{ matrix.end }}
        run: |
          set -euo pipefail
          printf -v lo "%03d" "$START_ROW"
          printf -v hi "%03d" "$END_ROW"
          tag="catalog377-images-v11-${lo}-${hi}-2026-11-14"
          dir="out/v11-${START_ROW}-${END_ROW}"
          zip="out/Catalog744_images_v11_${lo}-${hi}.zip"
          test -s "$zip"
          gh release create "$tag" "$zip" \
            "$dir/CONTACT_SHEET.png" \
            "$dir/PHOTO_SOURCES.csv" \
            "$dir/SUMMARY.json" \
            --title "Catalog 744 unfilled photos ${lo}-${hi} v11" \
            --notes-file "$dir/README.txt" --target main
          gh release view "$tag" --json assets,url --jq '{url:.url,assets:[.assets[].name]}'
