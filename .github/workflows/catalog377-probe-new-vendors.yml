name: Catalog 377 probe alternative exact vendor product HTML
on:
  push:
    paths:
      - '.github/workflows/catalog377-probe-new-vendors.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python product-research/catalog-377/probe_vendor_exact_remains.py
