name: Climate 347 stage 18 focused remaining technical PDF search
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage18.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf beautifulsoup4
      - run: python climate-347/technical-docs/stage18_focus.py
      - name: Publish focused candidate archive and audit
        run: |
          gh release create climate-347-pdf-stage18-${{ github.run_id }} /tmp/climate347v18/Climate_347_stage18_focused_review.zip /tmp/climate347v18/summary.json /tmp/climate347v18/focus_20.csv /tmp/climate347v18/download_attempts.csv /tmp/climate347v18/page_search_audit.csv --title 'Climate 347 — stage 18 focused remaining models review' --notes 'Review only; existing stage17 upload package unchanged. No Selectel upload.'
