name: Climate 347 stage 12 inspected manuals and winter catalogue
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/stage12_audit.py
      - name: Publish audited archive and delta
        run: |
          gh release create climate-347-pdf-stage12-${{ github.run_id }} /tmp/climate347v12/Climate_347_stage12_partial_Selectel.zip /tmp/climate347v12/Climate_347_stage12_delta_review.zip /tmp/climate347v12/summary.json /tmp/climate347v12/coverage_347.csv /tmp/climate347v12/remaining.csv /tmp/climate347v12/html_by_model.csv /tmp/climate347v12/partial_selectel_manifest.csv /tmp/climate347v12/download_attempts.csv --title 'Climate 347 — stage 12 inspected manuals and winter catalogue' --notes 'Verified model assignments; candidates separate. Selectel not uploaded.'
      - name: Publish source previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/technical-docs/stage12-previews
          if ! git diff --cached --quiet; then git commit -m 'Stage 12 source page evidence'; git pull --rebase; git push; fi
