name: Catalog744 v11 images generic test rows 83-97
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog377-images-v11-general-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q Pillow
      - name: Curate target-model photos from existing archived HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
          START_ROW: "83"
          END_ROW: "97"
          OUTPUT_DIR: out/v11-083-097
        run: python product-research/catalog-377/curate_images_v11_all_batches.py
      - name: Publish source-traceable stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kubenkoi97-cmyk/work-files-public
        run: |
          set -euo pipefail
          tag="catalog377-images-v11-083-097-2026-11-14"
          dir="out/v11-083-097"
          test -s "out/Catalog744_images_v11_083-097.zip"
          gh release create "$tag" "out/Catalog744_images_v11_083-097.zip" \
            "$dir/CONTACT_SHEET.png" "$dir/PHOTO_SOURCES.csv" "$dir/SUMMARY.json" \
            --title "Catalog-744 unfilled image batch 83-97" \
            --notes-file "$dir/README.txt" --target main
          gh release view "$tag" --json assets,url --jq '{url:.url,assets:[.assets[].name]}'
