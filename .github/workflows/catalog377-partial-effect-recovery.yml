name: Catalog377 recover authentic prose for 40 PARTIAL SKUs
on:
  push:
    paths:
      - '.github/workflows/catalog377-partial-effect-recovery.yml'
      - 'product-research/catalog-377/partial_effect_recovery.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {start: 168, end: 180, label: "169-180"}
          - {start: 180, end: 196, label: "181-196"}
          - {start: 196, end: 206, label: "197-206"}
          - {start: 340, end: 341, label: "341-341"}
          - {start: 349, end: 350, label: "350-350"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine HTML and image validators
        run: python -m pip install --quiet requests beautifulsoup4 lxml pillow
      - name: Capture exact SKU HTML without rewriting vendor copy
        run: python product-research/catalog-377/partial_effect_recovery.py --start ${{ matrix.start }} --end ${{ matrix.end }} --only-master-unresolved
      - name: Test archived ZIP CRC
        env:
          LABEL: ${{ matrix.label }}
        run: unzip -t "product-research/catalog-377/output/catalog377-$LABEL.zip" | tail -2
      - name: Publish batch archive and evidence CSV separately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          tag="catalog377-partial-effect-$LABEL"
          zip="product-research/catalog-377/output/catalog377-$LABEL.zip"
          csv="product-research/catalog-377/output/catalog377-$LABEL-status.csv"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$csv" --clobber
          else
            gh release create "$tag" "$zip" "$csv" \
              --title "Catalog 377 PARTIAL recovery exact original HTML $LABEL" \
              --notes "Authentic vendor HTML and resource files. Cyrillic/Latin visually confusable SKU letters are normalized for searching only. Original server bytes unchanged. Status COMPLETE requires independent product prose, specs, exact SKU and decoded local product photo. Do not promote master until evidence audit."
          fi
      - name: Save batch candidate statuses, never overwrite master without verification
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          cp "product-research/catalog-377/output/catalog377-$LABEL-status.csv" "product-research/catalog-377/status/partial-effect-$LABEL.csv"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "product-research/catalog-377/status/partial-effect-$LABEL.csv"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Evidence: recover PARTIAL original exact SKU pages $LABEL"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog377-partial-effect-${{ matrix.label }}
          path: product-research/catalog-377/output/
          retention-days: 7
