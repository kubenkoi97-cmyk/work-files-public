name: Climate 347 stage 10 reproducible audit and recovery
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf
      - run: python climate-347/technical-docs/stage10_audit.py
      - name: Publish audited archive and delta
        run: |
          gh release create climate-347-pdf-stage10-${{ github.run_id }} /tmp/climate347v10/Climate_347_stage10_partial_Selectel.zip /tmp/climate347v10/Climate_347_stage10_delta_review.zip /tmp/climate347v10/summary.json /tmp/climate347v10/coverage_347.csv /tmp/climate347v10/remaining.csv /tmp/climate347v10/html_by_model.csv /tmp/climate347v10/partial_selectel_manifest.csv /tmp/climate347v10/download_attempts.csv --title 'Climate 347 — stage 10 audited counts and PDF recovery' --notes 'Exact nonempty assignment counts, remaining models and delta candidates. Selectel not uploaded.'
