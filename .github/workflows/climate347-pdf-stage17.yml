name: Climate 347 stage 17 universal technical-only package
on:
  push:
    paths:
      - '.github/workflows/climate347-pdf-stage17.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: kubenkoi97-cmyk/work-files-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pymupdf beautifulsoup4
      - run: python climate-347/technical-docs/stage17_focus.py
      - name: Publish technical-only package and audit
        run: |
          gh release create climate-347-pdf-stage17-${{ github.run_id }} /tmp/climate347v17/Climate_347_stage17_partial_Selectel.zip /tmp/climate347v17/Climate_347_stage17_delta_review.zip /tmp/climate347v17/summary.json /tmp/climate347v17/coverage_347.csv /tmp/climate347v17/remaining.csv /tmp/climate347v17/html_by_model.csv /tmp/climate347v17/partial_selectel_manifest.csv /tmp/climate347v17/download_attempts.csv /tmp/climate347v17/winter_scope_review.csv /tmp/climate347v17/focus_22.csv /tmp/climate347v17/page_search_audit.csv /tmp/climate347v17/blocked_confirmed.csv --title 'Climate 347 — stage 13 universal technical-only package' --notes 'Certificates and declarations excluded from final package and coverage. Candidates separate. Selectel not uploaded.'
      - name: Publish source previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add climate-347/technical-docs/stage17-previews
          if ! git diff --cached --quiet; then git commit -m 'Stage 17 source page evidence'; git pull --rebase; git push; fi
