name: Catalog377 focused original HTML probe for last 2 Midea
on:
  push:
    paths:
      - '.github/workflows/catalog377-midea-final-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe direct exact-SKU sellers and collect independent original HTML evidence
        run: python product-research/catalog-377/probe_midea_last_two.py
      - name: Persist verifiable result after this stage
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/midea-final-2026-11-09/
          if git diff --cached --quiet; then echo 'No new evidence'; exit 0; fi
          git commit -m "Record real HTTP and exact-SKU HTML findings for two Midea variants"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 5
          done
          exit 1
