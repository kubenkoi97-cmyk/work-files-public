name: Catalog377 pilot - original MirCli HTML with photos
on:
  push:
    paths:
      - '.github/workflows/catalog377-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Capture first five Kentatsu exact-model pages
        run: python product-research/catalog-377/capture_batch.py --start 61 --end 66
      - name: Publish batch archive and CSV to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "catalog377-batch-062-066" \
            "product-research/catalog-377/output/catalog377-062-066.zip" \
            "product-research/catalog-377/output/catalog377-062-066-status.csv" \
            --title "Catalog 377 - batch 062-066 - Kentatsu VRF original HTML with photos" \
            --notes "Five exact-model listings from the uploaded product spreadsheet. Per model: original server HTML, offline HTML, local gallery photos, original URL, manifest. Status COMPLETE requires exact model and downloaded images."
      - name: Commit batch manifest
        shell: bash
        run: |
          set -eu
          mkdir -p product-research/catalog-377/status
          cp product-research/catalog-377/output/catalog377-062-066-status.csv product-research/catalog-377/status/batch-062-066.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-research/catalog-377/status/batch-062-066.csv
          git commit -m 'Track archive status Kentatsu models 062-066'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 4
          done
          exit 1
      - name: Upload redundant artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog377-pilot
          path: product-research/catalog-377/output/
          retention-days: 7
